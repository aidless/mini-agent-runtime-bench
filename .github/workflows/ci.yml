name: ci

on:
  push:
  pull_request:

jobs:
  gates-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Offline runtime tests
        run: python -m pytest tests/ -q
      - name: A1-A3 honesty gates (offline)
        run: python tools/check_gates.py
      - name: W2 runtime selftest (offline, four counter-examples)
        run: python tools/runtime_loop.py --selftest
