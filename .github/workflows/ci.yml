name: ci

on:
  push:
  pull_request:

jobs:
  gates-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install pytest
      - name: make check recomputes committed numbers
        run: make check
      - name: pytest runner (same tests, pytest assertions)
        run: python -m pytest tests/ -q
