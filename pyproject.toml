[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-agent-runtime-bench"
version = "0.1.0"
description = "Scripted-policy flip rate on a tiny frozen task set, plus runtime gates. Not an LLM-agent benchmark."
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
